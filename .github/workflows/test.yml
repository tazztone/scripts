name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shell-tests:
    name: Shell Toolbox Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sh/TOOLBOXES

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg zenity bc imagemagick

    - name: Run cross-version tests
      run: |
        chmod +x testing/*.sh
        bash testing/test_cross_version.sh

    - name: Run full test runner
      run: |
        bash testing/test_runner.sh

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests python-dotenv Pillow piexif safetensors

    - name: Run Python tests
      run: |
        pytest python

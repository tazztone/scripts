<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Perplexity Enhancements Mock</title>
  <style>
    body { font: 14px sans-serif; color: white; background: #111; padding: 40px; }
    .input-container { width: 520px; padding: 20px; border: 1px solid #444; border-radius: 8px; position: relative; }
    textarea { width: 100%; height: 50px; background: transparent; color: white; }
    button { cursor: pointer; }
    #model-select-btn { padding: 8px 14px; background: #222; color: white; border: 1px solid #555; border-radius: 20px; }
    #model-dropdown { display: none; position: absolute; top: 95px; left: 20px; width: 260px; padding: 8px; background: #222; border: 1px solid #555; z-index: 5; }
    #model-dropdown.open { display: block; }
    .dropdown-item { padding: 10px; color: white; }
    .thinking-row { display: flex; justify-content: space-between; border-top: 1px solid #555; margin-top: 6px; }
    #thinking-switch { width: 42px; }
    .card { width: 420px; margin-top: 30px; padding: 18px; border: 1px solid #444; }
    .approve { background: #0c6; color: white; border: 0; padding: 10px; }
    #attach-menu { display: none; position: absolute; background: #222; padding: 10px; }
    #attach-menu.visible { display: block; }
    .flyout { display: none; }
    #connectors-item:hover .flyout { display: block; }
    #suggestion-pill { width: 120px; border: 1px dashed #777; background: transparent; color: #aaa; padding: 6px; }
    .follow-up { width: 800px; display: block; color: #0c6; background: transparent; border: 0; }
  </style>
</head>
<body>
  <h1>Perplexity mock</h1>
  <form class="input-container">
    <textarea placeholder="Ask anything..."></textarea>
    <button id="model-select-btn" type="button">Best</button>
    <div id="model-dropdown">
      <div class="dropdown-item" data-model="Best">Best</div>
      <div class="dropdown-item" data-model="Sonar 2">Sonar 2</div>
      <div class="dropdown-item" data-model="Claude Sonnet 4.6">Claude Sonnet 4.6</div>
      <div class="dropdown-item thinking-row"><span>Thinking</span><button id="thinking-switch" type="button" role="switch" aria-checked="false">off</button></div>
      <div class="dropdown-item" data-model="Claude Opus 4.7" style="opacity:.5">Claude Opus 4.7 Max</div>
    </div>
  </form>

  <div class="card"><p>Agent action: create test.md</p><button id="approve-btn" class="approve">Approve action</button></div>
  <div class="card"><button id="confirm-btn" class="approve">Confirm action</button></div>

  <div style="margin-top:30px; position:relative">
    <button id="attach-btn" type="button" aria-label="Add files or tools">+</button>
    <div id="attach-menu">
      <div id="connectors-item" role="menuitem">Connectors and sources &gt;<div class="flyout"><div id="github-checkbox" role="menuitemcheckbox">GitHub</div></div></div>
    </div>
  </div>
  <div id="active-connectors"></div>
  <button id="suggestion-pill" type="button">+ GitHub</button>
  <button class="follow-up">Your complete github examples</button>

  <script>
    const modelButton = document.getElementById('model-select-btn');
    const dropdown = document.getElementById('model-dropdown');
    const thinking = document.getElementById('thinking-switch');
    let selectedModel = 'Best';
    let thinkingEnabled = false;
    function updateModel() {
      document.querySelectorAll('[data-model]').forEach(item => item.classList.toggle('selected', item.dataset.model === selectedModel));
      thinking.setAttribute('aria-checked', String(thinkingEnabled));
      modelButton.textContent = selectedModel + (thinkingEnabled && selectedModel !== 'Best' ? ' Thinking' : '');
    }
    modelButton.addEventListener('click', () => dropdown.classList.toggle('open'));
    document.querySelectorAll('[data-model]').forEach(item => item.addEventListener('click', () => { if (item.style.opacity !== '0.5') { selectedModel = item.dataset.model; updateModel(); dropdown.classList.remove('open'); } }));
    thinking.addEventListener('click', event => { event.stopPropagation(); thinkingEnabled = !thinkingEnabled; updateModel(); });
    document.getElementById('attach-btn').addEventListener('click', () => document.getElementById('attach-menu').classList.toggle('visible'));
    document.getElementById('github-checkbox').addEventListener('click', enableGithub);
    function enableGithub() {
      const pill = document.createElement('button'); pill.textContent = 'GitHub'; pill.setAttribute('aria-haspopup', 'menu'); document.getElementById('active-connectors').appendChild(pill);
      document.getElementById('attach-menu').classList.remove('visible');
    }
    document.getElementById('suggestion-pill').addEventListener('click', event => { enableGithub(); event.currentTarget.remove(); });
    document.querySelectorAll('.approve').forEach(button => button.addEventListener('click', () => { button.textContent = 'CLICKED'; }));
    updateModel();
  </script>
</body>
</html>
